# No ingress. Egress only to DNS and HTTPS: the broker (443) and the API server (443 or 6443). A standard
# NetworkPolicy cannot name a host; the Cilium component narrows egress to the broker's FQDN and the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aient-kube-connector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aient-kube-connector
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443

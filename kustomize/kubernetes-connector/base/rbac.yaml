apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aient-connector-mint
rules:
- apiGroups: [""]
  resources: [serviceaccounts/token]
  resourceNames: [aient-kconn-00000000000000000000000000000000]
  verbs: [create]
---

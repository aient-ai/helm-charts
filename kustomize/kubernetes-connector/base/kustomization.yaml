# The Aient Kubernetes connector and its viewer, as a customer applies it: the same objects as the Helm chart in
# ../../helm and as the manifest Aient's attach page generates. Build an overlay from examples/connection, which sets
# the connection ID and lists components/connection last. Plan:
# docs/plans/2026-10-20-feat-aient-readonly-cluster-view-plan.md#two-packagings-one-set-of-objects
# The installer creates the Secret aient-connector-key (the connection's Ed25519 private key, key `connector.key`);
# no packaging carries it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aient
resources:
- namespace.yaml
- serviceaccounts.yaml
- rbac.yaml
- viewer.yaml
- viewer-logs.yaml
- configmap.yaml
- deployment.yaml
- networkpolicy.yaml
images:
- name: aient-kube-connector
  newName: ghcr.io/aient-ai/kubernetes-connector
  newTag: 0.1.0
  digest: sha256:0b95e2e8c68a63f348be11a870dadb222198057c21cbb5494884494f3bf8f6a3

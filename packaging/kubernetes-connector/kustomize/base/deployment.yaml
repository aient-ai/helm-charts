# One replica: the broker holds one session per connection, and a second connector would replace it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aient-kube-connector
  labels:
    app.kubernetes.io/name: aient-kube-connector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aient-kube-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aient-kube-connector
      annotations:
        # sha256 of AIENT_BROKER_URL, so a new broker URL restarts the connector, which reads it at start. Kustomize
        # cannot hash: if you change the URL, change this to its sha256 too (Helm computes it).
        aient.ai/broker-url: 9eeba93426b91d18d81ed14e49f3579b9c2624b5e8cbf194ebaf60f550ba702e
    spec:
      serviceAccountName: aient-connector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The key Secret is mounted group-readable for this group, and readable by nobody else.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: connector
        image: aient-kube-connector
        envFrom:
        - configMapRef:
            name: aient-connection
        args:
        - --key-file=/var/run/aient/connector.key
        - --viewer=aient-kconn-00000000000000000000000000000000
        - --anchor=aient-kconn-00000000000000000000000000000000-anchor
        # Connector 0.1.x buffers each answer (up to --max-body-bytes, 4 MiB) and decodes it whole to redact it, for up to
        # 8 requests at once. Measured on 4 MiB lists: 89 MiB peak for one, 497 MiB with every slot busy and more queued;
        # 64Mi was OOM-killed by a single kubectl get pods -A (PRB-45413). 0.2.0 streams and needs far less.
        env:
        # The Go collector works harder as the heap nears the limit instead of letting garbage reach it.
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
        resources:
          requests:
            cpu: 100m
            memory: 640Mi
          limits:
            cpu: 100m
            memory: 640Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: key
          mountPath: /var/run/aient
          readOnly: true
      volumes:
      - name: key
        secret:
          secretName: aient-connector-key
          defaultMode: 0440

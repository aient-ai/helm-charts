# aient-connector runs the connector pod. Its only right is minting tokens for the viewer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aient-connector
---
# The viewer: the identity every forwarded command uses. Its name is aient-kconn-<the connection ID's hex>, set by
# components/connection. It holds no token of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aient-kconn-00000000000000000000000000000000
automountServiceAccountToken: false
---
# Every viewer token is bound to this Secret: deleting it revokes all of them at once. It holds no data.
apiVersion: v1
kind: Secret
metadata:
  name: aient-kconn-00000000000000000000000000000000-anchor
type: Opaque

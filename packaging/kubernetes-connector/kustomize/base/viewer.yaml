# The viewer's core reads: Kubernetes' built-in resources without Secrets, and the built-in API groups whole, with all
# their resources (Henrik, 2026-10-24). Pod logs are the separate -viewer-logs role. Declare the rules of every viewer
# role you install when you attach the cluster. Replace these rules with a patch to declare different RBAC. Verbs are
# only get, list and watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aient-kconn-00000000000000000000000000000000-viewer
rules:
- apiGroups: [""]
  resources: [componentstatuses, configmaps, endpoints, events, limitranges, namespaces, namespaces/status, nodes,
    nodes/status, persistentvolumeclaims, persistentvolumeclaims/status, persistentvolumes, persistentvolumes/status,
    pods, pods/status, podtemplates, replicationcontrollers, replicationcontrollers/scale,
    replicationcontrollers/status, resourcequotas, resourcequotas/status, serviceaccounts, services, services/status]
  verbs: [get, list, watch]
- apiGroups: [admissionregistration.k8s.io, apiextensions.k8s.io, apiregistration.k8s.io, apps, autoscaling, batch,
    certificates.k8s.io, coordination.k8s.io, discovery.k8s.io, events.k8s.io, flowcontrol.apiserver.k8s.io,
    metrics.k8s.io, networking.k8s.io, node.k8s.io, policy, rbac.authorization.k8s.io, resource.k8s.io,
    scheduling.k8s.io, storage.k8s.io]
  resources: ["*"]
  verbs: [get, list, watch]
---
# Cluster-wide by default. components/namespace-scoped removes this binding; RoleBindings then grant the same role in
# the listed namespaces only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aient-kconn-00000000000000000000000000000000-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aient-kconn-00000000000000000000000000000000-viewer
subjects:
- kind: ServiceAccount
  name: aient-kconn-00000000000000000000000000000000
  namespace: aient

{{- if .Values.networkPolicy.cilium.enabled }}
{{- $broker := urlParse .Values.connection.brokerUrl }}
{{- if contains ":" $broker.host }}
{{- fail "networkPolicy.cilium.enabled allows the broker on port 443 only; connection.brokerUrl names another port" }}
{{- end }}
# No ingress. Egress only to cluster DNS, the broker's host name on 443 and the API server on 443 or 6443.
# toFQDNs works only for names the pod resolved through Cilium's DNS proxy, so the DNS rule sends lookups through it.
# It admits any name, because the resolver also tries the pod's search domains first; only connections are limited.
# kube-apiserver is the entity Cilium gives the API server's addresses, including k3s servers on the host network.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aient-kube-connector
  namespace: aient
  labels:
    {{- include "kubernetes-connector.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: aient-kube-connector
  ingressDeny:
  - fromEntities: [all]
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: {{ $broker.host }}
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities: [kube-apiserver]
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "6443"
        protocol: TCP
---
{{- end }}
# No ingress. Egress only to DNS and HTTPS: the broker (443) and the API server (443 or 6443). A standard
# NetworkPolicy cannot name a host; networkPolicy.cilium.enabled narrows egress to the broker's host name and the API
# server. With it, this policy keeps its name but allows nothing, so that `kubectl apply`, which does not delete an
# object that left the manifest, narrows an installation that has the generic policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aient-kube-connector
  namespace: aient
  labels:
    {{- include "kubernetes-connector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aient-kube-connector
  policyTypes: [Ingress, Egress]
{{- if not .Values.networkPolicy.cilium.enabled }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
{{- end }}

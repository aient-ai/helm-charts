{{- $viewer := include "kubernetes-connector.viewer" . -}}
# aient-connector runs the connector pod. Its only right is minting tokens for the viewer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aient-connector
  namespace: aient
  labels:
    {{- include "kubernetes-connector.labels" . | nindent 4 }}
---
# The viewer: the identity every forwarded command uses. It holds no token of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $viewer }}
  namespace: aient
  labels:
    {{- include "kubernetes-connector.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Every viewer token is bound to this Secret: deleting it revokes all of them at once. It holds no data.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $viewer }}-anchor
  namespace: aient
  labels:
    {{- include "kubernetes-connector.labels" . | nindent 4 }}
type: Opaque

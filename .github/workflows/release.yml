name: Release

# github.com/aient-ai/helm-charts releases its charts with this workflow, installed on main as
# .github/workflows/release.yml. Its source is packaging/release/public-repo/release.yml in Aient's private repository,
# which reaches this repository's `source` branch with the rest of the release sources
# (.github/workflows/sync-helm-charts-source.yml there); a repository administrator copies it to main:
#   git fetch origin source && git show FETCH_HEAD:packaging/release/public-repo/release.yml > .github/workflows/release.yml
# The sync never writes .github. A workflow pushed to `source` by anyone else holding its deploy key would still run,
# so nothing that can publish is reachable without this workflow's environment: see publish.
#
# Run by hand: `gh workflow run release.yml --repo aient-ai/helm-charts -f chart=kubernetes-connector [-f source=<commit>]`.
# The version is the chart's version on that commit of `source` (default: its tip).
#
# gate: no secrets. The source commit must be on `source` and carry the gitsign signature of Aient's sync workflow on
#   its main branch, checked with a gitsign pinned here before any file of the commit runs. Then Helm and Kustomize
#   render the same objects, every image the chart pins is signed by its own release workflow, and Trivy finds no
#   fixable critical vulnerability.
# publish: in the environment `release`, which requires a reviewer's approval and admits only main. Pushes and signs
#   the OCI chart, signs the package and attests its provenance, then pushes main, gh-pages and a signed tag
#   <chart>-<version>. Only the release GitHub App, whose key only this environment holds, may write those refs (a
#   ruleset); the sync workflow's deploy key may write only `source`.
# verify: as a customer fetches the artifacts.
# Each publish script is idempotent, so the workflow can be rerun after any failure.

on:
  workflow_dispatch:
    inputs:
      chart:
        description: The chart to release, packaging/<chart> on the source branch
        required: true
        default: kubernetes-connector
      source:
        description: The commit of the source branch to release (default its tip)
        required: false

permissions:
  contents: read

concurrency:
  # One release at a time: every chart's release updates the same gh-pages index.
  group: release
  cancel-in-progress: false

env:
  CHART_OCI_REGISTRY: oci://ghcr.io/aient-ai/charts
  HELM_CHARTS_PAGES_URL: https://aient-ai.github.io/helm-charts
  # The only identity whose source commits this workflow releases.
  SOURCE_SIGNER: https://github.com/haf/glimt/.github/workflows/sync-helm-charts-source.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  COSIGN_BINARY: cosign-linux-amd64
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
  COSIGN_VERSION: v3.1.3
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
  GITSIGN_VERSION: v0.17.1
  HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
  HELM_VERSION: v3.22.0
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  KUSTOMIZE_VERSION: v5.8.1
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
  TRIVY_VERSION: 0.75.0

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      chart: ${{ steps.release.outputs.chart }}
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: The source commit
        id: source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          sha=${SOURCE:-$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/source | cut -f1)}
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "source must be a full commit SHA, not '$sha'" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Before any file of the commit runs, so a commit Aient's sync workflow did not sign cannot change the checks.
      - name: The commit is on source and signed by Aient's sync workflow
        env:
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gitsign="$RUNNER_TEMP/gitsign"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$gitsign" \
            "https://github.com/sigstore/gitsign/releases/download/${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION#v}_linux_amd64"
          printf '%s  %s\n' "$GITSIGN_SHA256" "$gitsign" | sha256sum --check --strict --quiet -
          chmod 0555 "$gitsign"
          git merge-base --is-ancestor "$SHA" origin/source || { echo "$SHA is not on the source branch" >&2; exit 1; }
          "$gitsign" verify --certificate-identity "$SOURCE_SIGNER" --certificate-oidc-issuer "$ISSUER" "$SHA"
      - name: Chart and version
        id: release
        env:
          CHART: ${{ inputs.chart }}
        run: |
          set -euo pipefail
          [[ "$CHART" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "not a chart name: $CHART" >&2; exit 1; }
          file="packaging/$CHART/helm/Chart.yaml"
          [[ -f "$file" ]] || { echo "no chart packaging/$CHART" >&2; exit 1; }
          [[ $(awk '$1 == "name:" {print $2}' "$file") == "$CHART" ]] || { echo "$file is not chart $CHART" >&2; exit 1; }
          version=$(awk '$1 == "version:" {print $2}' "$file")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$file version $version is not <major>.<minor>.<patch>" >&2; exit 1; }
          printf 'chart=%s\nversion=%s\n' "$CHART" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      # The contract test needs only yaml.
      - name: Install the test's dependencies
        run: npm install --silent --no-save --no-package-lock yaml@2.8.4
      - name: Install pinned tools
        run: bash packaging/release/install-tools.sh "$RUNNER_TEMP/bin" helm cosign trivy kustomize
      - name: Helm and Kustomize render the same objects
        env:
          AIENT_REQUIRE_HELM: '1'
          CHART: ${{ steps.release.outputs.chart }}
        run: node --test "tests/quality/${CHART}-packaging-contract.test.mjs"
      # yq is on GitHub's ubuntu-24.04 image.
      - name: Every pinned image is signed by its release workflow, with no fixable critical vulnerability
        env:
          CHART: ${{ steps.release.outputs.chart }}
        run: bash packaging/release/gate.sh "$CHART"

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      # Keyless signing: Sigstore issues the certificates for this workflow's OIDC identity.
      id-token: write
      # The build-provenance attestations.
      attestations: write
    outputs:
      digest: ${{ steps.oci.outputs.digest }}
      commit: ${{ steps.repo.outputs.commit }}
    env:
      CHART: ${{ needs.gate.outputs.chart }}
      VERSION: ${{ needs.gate.outputs.version }}
      SOURCE: ${{ needs.gate.outputs.source }}
      COSIGN_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
    steps:
      # The commit the gate verified; a SHA names its whole tree.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      # The environment's secrets: the release App's key, whose token may write main, gh-pages and tags, and a token
      # that may write the aient-ai organisation's packages. GITHUB_TOKEN gets neither, so no other workflow in this
      # repository can publish.
      - name: Require the release credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          AIENT_AI_GHCR_TOKEN: ${{ secrets.AIENT_AI_GHCR_TOKEN }}
        run: |
          missing=()
          [[ -n "$RELEASE_APP_CLIENT_ID" ]] || missing+=(RELEASE_APP_CLIENT_ID)
          [[ -n "$RELEASE_APP_PRIVATE_KEY" ]] || missing+=(RELEASE_APP_PRIVATE_KEY)
          [[ -n "$AIENT_AI_GHCR_TOKEN" ]] || missing+=(AIENT_AI_GHCR_TOKEN)
          if (( ${#missing[@]} )); then
            echo "::error title=Release credential missing::Environment release lacks ${missing[*]}. Nothing was published."
            exit 1
          fi
      - name: Install pinned tools
        run: bash packaging/release/install-tools.sh "$RUNNER_TEMP/bin" helm cosign gitsign
      # cosign and the attestation read Docker's login; helm keeps its own.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # The token's owner.
          username: haf
          password: ${{ secrets.AIENT_AI_GHCR_TOKEN }}
      - name: Log Helm in to GHCR
        env:
          AIENT_AI_GHCR_TOKEN: ${{ secrets.AIENT_AI_GHCR_TOKEN }}
        run: printf '%s' "$AIENT_AI_GHCR_TOKEN" | helm registry login ghcr.io --username haf --password-stdin
      - name: Package the chart
        run: helm package "packaging/$CHART/helm" --destination "$RUNNER_TEMP/package"
      - name: Push and sign the OCI chart
        id: oci
        run: bash packaging/release/publish-oci.sh "$CHART" "$VERSION" "$RUNNER_TEMP/package/$CHART-$VERSION.tgz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_OCI_REGISTRY }}/${{ env.CHART }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: ${{ steps.oci.outputs.tgz }}
      - name: Sign the package for the Helm repository
        env:
          TGZ: ${{ steps.oci.outputs.tgz }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "$TGZ.sigstore.json" "$TGZ" >/dev/null
          cosign verify-blob "$TGZ" --bundle "$TGZ.sigstore.json" --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$ISSUER"
          cp "$PROVENANCE" "$TGZ.provenance.sigstore.json"
      # Created last and revoked when the job ends, so the token lives only for the push.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Publish to this repository
        id: repo
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          TGZ: ${{ steps.oci.outputs.tgz }}
        run: |
          set -euo pipefail
          # The token reaches git as a header from the environment, never in a remote URL or a config file.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export HELM_CHARTS_REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          export RELEASE_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$SOURCE"
          bash packaging/release/publish-repo.sh "$CHART" "$VERSION" "$TGZ" "$TGZ.sigstore.json" "$TGZ.provenance.sigstore.json"
      - name: Summary
        env:
          DIGEST: ${{ steps.oci.outputs.digest }}
          COMMIT: ${{ steps.repo.outputs.commit }}
        run: |
          {
            echo "\`${CHART}\` ${VERSION} from source \`${SOURCE}\`: \`${CHART_OCI_REGISTRY#oci://}/${CHART}@${DIGEST}\`, ${HELM_CHARTS_PAGES_URL}, and tag \`${CHART}-${VERSION}\` = \`${COMMIT}\`."
            echo
            echo "Verify: \`cosign verify ${CHART_OCI_REGISTRY#oci://}/${CHART}@${DIGEST} --certificate-identity '${COSIGN_IDENTITY}' --certificate-oidc-issuer ${ISSUER}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHART: ${{ needs.gate.outputs.chart }}
      VERSION: ${{ needs.gate.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      COMMIT: ${{ needs.publish.outputs.commit }}
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - name: Install the test's dependencies
        run: npm install --silent --no-save --no-package-lock yaml@2.8.4
      - name: Install pinned tools
        run: bash packaging/release/install-tools.sh "$RUNNER_TEMP/bin" helm cosign gitsign kustomize
      - name: Verify the signatures
        run: |
          set -euo pipefail
          cosign verify "${CHART_OCI_REGISTRY#oci://}/${CHART}@${DIGEST}" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          # GitHub Pages serves a push after its deployment finishes.
          for attempt in $(seq 1 40); do
            curl -fsS "$HELM_CHARTS_PAGES_URL/index.yaml" | grep -q "/${CHART}-${VERSION}.tgz" && break
            [[ $attempt -lt 40 ]] || { echo "the Helm repository never listed ${CHART} ${VERSION}" >&2; exit 1; }
            sleep 15
          done
          cd "$RUNNER_TEMP"
          curl -fsSO "$HELM_CHARTS_PAGES_URL/${CHART}-${VERSION}.tgz"
          curl -fsSO "$HELM_CHARTS_PAGES_URL/${CHART}-${VERSION}.tgz.sigstore.json"
          cosign verify-blob "${CHART}-${VERSION}.tgz" --bundle "${CHART}-${VERSION}.tgz.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" helm-charts
          cd helm-charts
          [[ $(git rev-parse "${CHART}-${VERSION}^{commit}") == "$COMMIT" ]] || { echo "tag ${CHART}-${VERSION} is not $COMMIT" >&2; exit 1; }
          gitsign verify-tag "${CHART}-${VERSION}" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
      - name: The OCI chart and the published tree render the same objects
        env:
          AIENT_REQUIRE_HELM: '1'
          PUBLISHED_REPO_COMMIT: ${{ needs.publish.outputs.commit }}
        run: PUBLISHED_CHART="${CHART_OCI_REGISTRY}/${CHART}:${VERSION}" node --test "tests/quality/${CHART}-packaging-contract.test.mjs"
      - name: The Helm repository's chart and the published tree render the same objects
        env:
          AIENT_REQUIRE_HELM: '1'
          PUBLISHED_REPO_COMMIT: ${{ needs.publish.outputs.commit }}
        run: PUBLISHED_CHART="${HELM_CHARTS_PAGES_URL}:${VERSION}" node --test "tests/quality/${CHART}-packaging-contract.test.mjs"
